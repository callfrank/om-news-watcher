name: OM News Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: om-news-watcher-repo
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: Websites prüfen und RSS erzeugen
        run: node watcher.js

      - name: Änderungen speichern
        shell: bash
        run: |
          set -e

          git config user.name "OM News Watcher"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json data/items.json docs/feed.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu speichern."
            exit 0
          fi

          git commit -m "Update news feed"

          # Während der Laufzeit kann z. B. die Mac-App sources.json
          # geändert haben. Deshalb vor dem Push den neuesten main-Stand
          # holen und unseren Commit darauf neu aufsetzen.
          for attempt in 1 2 3; do
            echo "Push-Versuch $attempt von 3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Änderungen erfolgreich gespeichert."
              exit 0
            fi

            echo "Push wurde zwischenzeitlich überholt – neuer Versuch ..."
            sleep 2
          done

          echo "Fehler: Änderungen konnten nach 3 Versuchen nicht gespeichert werden."
          exit 1

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Pages-Dateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: watch
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
