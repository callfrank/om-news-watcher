name: OM News Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: om-news-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: Websites prüfen und RSS erzeugen
        run: node watcher.js

      - name: Änderungen speichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "OM News Watcher"
          git config user.email "actions@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          cp data/state.json "$TMP_DIR/state.json"
          cp data/items.json "$TMP_DIR/items.json"
          cp docs/feed.xml "$TMP_DIR/feed.xml"

          for attempt in 1 2 3; do
            echo "Speicher-Versuch $attempt von 3"

            # Die drei Dateien sind reine Build-Artefakte. Deshalb wird
            # nicht versucht, zwei unterschiedliche feed.xml-Versionen
            # per Rebase zusammenzuführen. Zuerst neuesten main holen,
            # danach die gerade erzeugten Dateien wieder darüberlegen.
            git fetch origin main
            git reset --hard origin/main

            cp "$TMP_DIR/state.json" data/state.json
            cp "$TMP_DIR/items.json" data/items.json
            cp "$TMP_DIR/feed.xml" docs/feed.xml

            git add data/state.json data/items.json docs/feed.xml

            if git diff --cached --quiet; then
              echo "Keine Änderungen – nichts zu speichern."
              exit 0
            fi

            git commit -m "Update news feed"

            if git push origin HEAD:main; then
              echo "Änderungen erfolgreich gespeichert."
              exit 0
            fi

            echo "main wurde erneut geändert – neuer Versuch mit frischem Stand."
            sleep 2
          done

          echo "Fehler: Änderungen konnten nach 3 Versuchen nicht gespeichert werden."
          exit 1

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Pages-Dateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: watch
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
