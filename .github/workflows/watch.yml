name: OM News Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: om-news-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: 'chrome'

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Vorinstalliertes Chrome prüfen
        shell: bash
        run: |
          set -e
          google-chrome --version
          echo "Playwright verwendet Browser-Channel: $PLAYWRIGHT_CHANNEL"

      - name: Watcher v0.34-Patch anwenden
        run: python3 patch-watcher-v0.34.py

      - name: Websites prüfen und RSS erzeugen
        run: node watcher.js

      - name: Änderungen speichern
        shell: bash
        run: |
          set -e

          git config user.name "OM News Watcher"
          git config user.email "actions@users.noreply.github.com"

          echo "Status nach Watcher-Lauf:"
          git status --short

          # Persistenz-/Feed-Dateien sowie den einmalig gepatchten Watcher erfassen.
          git add -A data docs watcher.js

          if git diff --cached --quiet; then
            echo "Keine relevanten Änderungen – nichts zu speichern."

            # Temporäre Änderungen aus npm/Runner verwerfen.
            git reset --hard HEAD
            git clean -fd
          else
            git commit -m "Update news feed"

            # Nach dem Commit dürfen für den Rebase keine lokalen
            # Nebenänderungen mehr vorhanden sein.
            git reset --hard HEAD
            git clean -fd
          fi

          for attempt in 1 2 3; do
            echo "Push-Versuch $attempt von 3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Änderungen erfolgreich gespeichert."
              exit 0
            fi

            echo "Remote wurde zwischenzeitlich geändert – neuer Versuch ..."
            sleep 2
          done

          echo "Fehler: Änderungen konnten nach 3 Versuchen nicht gespeichert werden."
          exit 1

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Pages-Dateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: watch
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
