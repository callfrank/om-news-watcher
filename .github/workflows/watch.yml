name: OM News Watcher

on:
  workflow_dispatch:
  schedule:
    # Zweimal pro Stunde
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: om-news-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: Websites prüfen und RSS erzeugen
        run: node watcher.js

      - name: Änderungen speichern
        shell: bash
        run: |
          git config user.name "OM News Watcher"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json data/items.json docs/feed.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Update news feed"
            git push
          fi

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Pages-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: watch

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
