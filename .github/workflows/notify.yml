name: OM News Watcher Email

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Test-E-Mail unabhängig vom Zeitplan senden'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

# Watcher und Mail dürfen nicht gleichzeitig Build-Zustände in main schreiben.
concurrency:
  group: om-news-watcher
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Aktuellsten Reader-Stand laden
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: E-Mail-Benachrichtigung prüfen
        env:
          OM_NOTIFY_FORCE: ${{ github.event.inputs.force }}
          OM_SMTP_HOST: ${{ secrets.OM_SMTP_HOST }}
          OM_SMTP_PORT: ${{ secrets.OM_SMTP_PORT }}
          OM_SMTP_USER: ${{ secrets.OM_SMTP_USER }}
          OM_SMTP_PASSWORD: ${{ secrets.OM_SMTP_PASSWORD }}
          OM_EMAIL_FROM: ${{ secrets.OM_EMAIL_FROM }}
          OM_EMAIL_TO: ${{ secrets.OM_EMAIL_TO }}
        run: node notify.js

      - name: E-Mail-Status speichern
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f data/email-state.json ]; then
            echo "Kein E-Mail-Status zu speichern."
            exit 0
          fi

          git config user.name "OM News Watcher"
          git config user.email "actions@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          cp data/email-state.json "$TMP_DIR/email-state.json"

          for attempt in 1 2 3; do
            echo "Speicher-Versuch $attempt von 3"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp "$TMP_DIR/email-state.json" data/email-state.json
            git add data/email-state.json

            if git diff --cached --quiet; then
              echo "Kein geänderter E-Mail-Status."
              exit 0
            fi

            git commit -m "Update email notification state"

            if git push origin HEAD:main; then
              echo "E-Mail-Status erfolgreich gespeichert."
              exit 0
            fi

            echo "main wurde erneut geändert – neuer Versuch."
            sleep 2
          done

          echo "Fehler: E-Mail-Status konnte nicht gespeichert werden."
          exit 1
