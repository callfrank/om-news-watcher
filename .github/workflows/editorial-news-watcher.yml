name: OM Redaktioneller E-Commerce-News-Watcher

on:
  workflow_dispatch:
  schedule:
    # Beide CET/CEST-Varianten. Das Skript führt nur um 07:30 bzw. 12:00 Europe/Berlin aus.
    - cron: "30 5,6 * * 1-5"
    - cron: "0 10,11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: om-editorial-news-watcher
  cancel-in-progress: false

jobs:
  editorial-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Redaktionellen Bericht mit Sol erstellen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node editorial-report.js

      - name: Bericht und Dublettenregister speichern
        shell: bash
        run: |
          set -e
          git config user.name "OM Editorial News Watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/editorial-state.json docs/editorial/latest.md docs/editorial/latest.html
          if git diff --cached --quiet; then
            echo "Keine Berichtänderung."
            exit 0
          fi
          git commit -m "Update editorial e-commerce report"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Bericht konnte nicht gespeichert werden."
          exit 1
